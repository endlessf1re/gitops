apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      imagePullSecrets:
      - name: nexus-auth
      containers:
      - name: app
        image: host.k3d.internal:5000/myapp-flask:d4172a3
        ports:
        - containerPort: 5003
        env:                    # ← env внутри containers, с отступом 8 пробелов
          - name: DB_HOST
            valueFrom:
              secretKeyRef:
                name: app-db-secret
                key: DB_HOST
          - name: DB_PORT
            valueFrom:
              secretKeyRef:
                name: app-db-secret
                key: DB_PORT
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: app-db-secret
                key: DB_USER
          - name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: app-db-secret
                key: DB_PASS
          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                name: app-db-secret
                key: DB_NAME
