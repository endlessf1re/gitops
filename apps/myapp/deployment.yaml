apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      imagePullSecrets:
      - name: nexus-auth
      containers:
      - name: app
        image: host.k3d.internal:5000/myapp-flask:3a31a3c
        ports:
        - containerPort: 80
